[workspace]
resolver = "2"
members = ["crates/core", "apps/cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["cicbyte"]
license = "MIT"
repository = "https://github.com/cicbyte/byte-git"

[workspace.dependencies]
# === 序列化 ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# === 错误处理 ===
anyhow = "1"
thiserror = "2"
# === 异步运行时（桌面端用）===
tokio = { version = "1", features = ["full"] }
# === HTTP（GitHub API / 下载）===
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking", "stream"] }
# === 工具 ===
dirs = "6"
include_dir = "0.7"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
# 环视支持（airewrite 检测规则用负向前瞻，RE2 语法表达不了）
fancy-regex = "0.14"
# === Lua 规则引擎（clone 代理规则 / hook 脚本）===
mlua = { version = "0.10", features = ["lua54", "vendored"] }
# === 压缩（archive tar.gz）===
flate2 = "1"
# === TUI（logview）===
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
opt-level = "z"      # 体积优先
lto = true
codegen-units = 1
strip = true
panic = "abort"
